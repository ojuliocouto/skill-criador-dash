name: portabilidade

# Prova a skill em Windows, macOS e Linux DE VERDADE (máquinas reais do GitHub), não por simulação.
# A suíte inteira roda por um comando só (scripts/rodar-testes.mjs): npm test do starter-kit, todos os
# scripts/test-*.py (pelo py.mjs) e todos os scripts/test-*.cjs, sem curinga de shell. No CI a variável CI
# está ligada: teste que pula por falta de Playwright, de um motor (Chromium, Firefox, WebKit) ou do axe-core conta como falha,
# porque aqui eles existem de propósito. A matriz de navegadores (scripts/test-navegadores.cjs) e a acessibilidade
# (scripts/test-acessibilidade.cjs) rodam nos três sistemas junto com o resto.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: suíte completa (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A versão do axe é fixa: as contagens de acessibilidade não mudam sozinhas.
      - name: Instalar o Playwright e o axe-core (pacotes globais)
        run: npm install -g playwright axe-core@4.13.0

      - name: Baixar Chromium, Firefox e WebKit (Linux, com as bibliotecas do sistema)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Baixar Chromium, Firefox e WebKit (Windows e macOS)
        if: runner.os != 'Linux'
        run: npx playwright install chromium firefox webkit

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: ffmpeg (Windows; o runner não traz winget, então choco)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Versões
        run: |
          node --version
          python --version
          ffmpeg -version
          node scripts/py.mjs --descobrir

      - name: Suíte inteira
        run: node scripts/rodar-testes.mjs

  python-3-8:
    # O SKILL.md, o README e o py.mjs prometem Python 3.8 ou mais novo. A suíte principal usa o 3.12, que
    # não pega recurso do 3.9 em diante (na 3.7.4 o gate-etapas.py quebrava no 3.8 com Path.is_relative_to).
    # Aqui os testes .py rodam num Python 3.8 de verdade, instalado pelo uv (tem 3.8 para qualquer sistema).
    name: testes .py no Python 3.8 (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: uv
        uses: astral-sh/setup-uv@v6

      - name: Python 3.8 na frente do PATH
        run: |
          uv python install 3.8
          echo "$(dirname "$(uv python find 3.8)")" >> "$GITHUB_PATH"

      - name: Versões
        run: |
          python3 --version
          node scripts/py.mjs --descobrir

      - name: Testes .py
        run: node scripts/rodar-testes.mjs --so-portateis --filtro .py

  caminho-com-acento-e-espaco:
    name: testes portáteis em pasta com acento e espaço (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clonar para C:\curso automação\skill
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\curso automação" | Out-Null
          git clone "$env:GITHUB_WORKSPACE" "C:\curso automação\skill"
          Get-ChildItem "C:\curso automação\skill\scripts\rodar-testes.mjs"

      - name: Testes portáteis a partir de lá
        shell: pwsh
        working-directory: C:\curso automação\skill
        run: node scripts/rodar-testes.mjs --so-portateis
