<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var d=document.documentElement,i=/^\/dashboard(\.html)?$/.test(location.pathname)?new URLSearchParams(location.search).get('id'):null,t=i?localStorage.getItem('cd-theme:'+i):null,m=d.getAttribute('data-modo');if(t!=='light'&&t!=='dark'){t=m==='claro'?'light':m==='escuro'?'dark':localStorage.getItem('cd-theme');}if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}d.dataset.theme=t;if(i&&d.hasAttribute('data-saudacao')&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)&&!sessionStorage.getItem('cd-saudou:'+i)){d.setAttribute('data-saudar','');}}catch(e){}</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235b62d6'/%3E%3Crect x='8' y='16' width='4' height='9' fill='white'/%3E%3Crect x='14' y='11' width='4' height='14' fill='white'/%3E%3Crect x='20' y='7' width='4' height='18' fill='white'/%3E%3C/svg%3E" />
  <title>Criador Dash</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/presenca.css" />
  <link rel="stylesheet" href="/assets/css/efeitos.css" />
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      Criador Dash
      <small>painéis de marketing e vendas</small>
    </div>
    <div class="actions" style="display:flex;gap:8px">
      <a class="btn ghost" href="/group.html">Novo grupo</a>
      <a class="btn" href="/config.html">Novo dashboard</a>
    </div>
  </header>

  <main id="main" tabindex="-1" class="wrap">
    <h1>Seus dashboards</h1>
    <p class="subtitle">Conecte uma planilha ou CSV, escolha o domínio e publique. Sem código.</p>

    <div id="lista" class="section">
      <div class="card esqueleto" role="status" aria-busy="true"><span class="so-leitor">Carregando os seus painéis</span><div class="esq-item"><div class="esq-item__textos"><span class="esq-barra esq-barra--texto" style="width:min(260px, 60%);height:13px"></span><span class="esq-barra esq-barra--texto" style="width:150px"></span></div><span class="esq-barra esq-barra--campo" style="width:150px"></span></div><div class="esq-item"><div class="esq-item__textos"><span class="esq-barra esq-barra--texto" style="width:min(260px, 60%);height:13px"></span><span class="esq-barra esq-barra--texto" style="width:150px"></span></div><span class="esq-barra esq-barra--campo" style="width:150px"></span></div><div class="esq-item"><div class="esq-item__textos"><span class="esq-barra esq-barra--texto" style="width:min(260px, 60%);height:13px"></span><span class="esq-barra esq-barra--texto" style="width:150px"></span></div><span class="esq-barra esq-barra--campo" style="width:150px"></span></div></div>
    </div>
  </main>

  <script type="module" src="/assets/js/index-page.js"></script>
  <script type="module" src="/assets/js/lib/theme.js"></script>
</body>
</html>
